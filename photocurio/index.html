<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhotoCurio Support</title>
<meta name="description" content="Support, frequently asked questions and the privacy policy for PhotoCurio.">
<style>
:root { color-scheme: light dark; --bg: #fbfaf8; --fg: #1d1d1f; --muted: #6e6e73; --rule: #e3e1dc; --accent: #8b15f7; --badge: #efe7fb; }
@media (prefers-color-scheme: dark) { :root { --bg: #151417; --fg: #f2f2f4; --muted: #a1a1a6; --rule: #2e2c33; --accent: #c08cff; --badge: #2c2238; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
main { max-width: 44rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
header h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 .25rem; }
header p { color: var(--muted); margin: 0 0 2.5rem; }
h2 { font-size: 1.35rem; margin: 3rem 0 0; padding-top: 1rem; border-top: 1px solid var(--rule); }
h3 { font-size: 1.1rem; margin: 2rem 0 .5rem; scroll-margin-top: 1rem; }
nav h2.toc-heading { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border: 0; margin: 1.5rem 0 .25rem; padding: 0; }
ul.toc { list-style: none; padding: 0; margin: 0; }
ul.toc li { margin: .3rem 0; }
ul.links { list-style: none; padding: 0; font-size: 1.15rem; }
ul.links li { margin: .6rem 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
ul, ol { padding-left: 1.4rem; }
li { margin: .35rem 0; }
code { font: .9em ui-monospace, SFMono-Regular, Menlo, monospace; }
.badge { display: inline-block; vertical-align: middle; font-size: .72rem; font-weight: 600; padding: .1rem .5rem; border-radius: 1rem; background: var(--badge); color: var(--accent); margin-left: .25rem; }
footer { margin-top: 4rem; padding-top: 1rem; border-top: 1px solid var(--rule); color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
<header>
<h1>PhotoCurio Support</h1>
<p>PhotoCurio for iPad and Apple TV, from Salt Air Works.</p>
</header>
<ul class="links">
  <li><a href="faq/">Support &amp; FAQ</a></li>
  <li><a href="privacy/">Privacy Policy</a></li>
</ul>
<footer>
<p>Email <a href="mailto:support@saltairworks.com">support@saltairworks.com</a>.</p>
<p>© 2026 Salt Air Works.</p>
</footer>
</main>
</body>
</html>
